name: Publish Jarvis self-diagnostic advisory ZIP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-jarvis-self-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Download catalog
        uses: actions/checkout@v4
        with:
          ref: main
          path: catalog
      - name: Checkout reviewed self-diagnostic source
        uses: actions/checkout@v4
        with:
          ref: aeb87d25dbad6559d903ac46754d51ddfcae9cd3
          path: source
          persist-credentials: false
      - name: Build ZIP and source manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import hashlib,json
          source=Path("source")
          target=Path("catalog/Download/Jarvis-Autodiagnosi-e-Miglioramenti.zip")
          target.parent.mkdir(parents=True,exist_ok=True)
          prefix="Jarvis-Autodiagnosi/"
          manifest=[]
          with ZipFile(target,"w",ZIP_DEFLATED,compresslevel=6) as z:
              for file in sorted(source.rglob("*")):
                  if not file.is_file(): continue
                  parts=file.relative_to(source).parts
                  if parts[0] in ("Download",".github") or any(
                      p in (".git",".venv","venv","__pycache__") for p in parts):
                      continue
                  arc=prefix+"/".join(parts)
                  z.write(file,arc)
                  manifest.append({
                      "path":arc,"sha256":hashlib.sha256(file.read_bytes()).hexdigest()
                  })
              z.writestr(prefix+"SOURCE-COMMIT.txt","aeb87d25dbad6559d903ac46754d51ddfcae9cd3\n")
              z.writestr(prefix+"SOURCE-MANIFEST.json",json.dumps(manifest,indent=2))
          with ZipFile(target) as z:
              assert z.testzip() is None
              files=set(z.namelist())
              for expected in ("avvia_jarvis.bat","jarvis.py",
                    "self_diagnostics.py","source_review.py",
                    "tests/test_self_review.py","tests/test_project_maintenance.py",
                    "docs/AUTODIAGNOSI_E_CONSIGLI.md",
                    "managed_documents.py","document_recovery.py"):
                  assert prefix+expected in files,expected
          print("VERIFIED",target,target.stat().st_size,"bytes")
          PY
      - name: Publish ZIP preserving older versions
        shell: bash
        run: |
          git -C catalog config user.name "github-actions[bot]"
          git -C catalog config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C catalog add Download/Jarvis-Autodiagnosi-e-Miglioramenti.zip
          git -C catalog commit -m "download: Jarvis source self-diagnostic advice build"
          git -C catalog push origin HEAD:main
