name: Jarvis unit and GPT protocol checks

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.mjs'
      - '**.ps1'
      - '**.bat'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - '**.py'
      - '**.mjs'
      - '**.ps1'
      - '**.bat'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  unit:
    name: Python and Node checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - name: Python syntax
        run: python -m compileall -q .
      - name: GPT JavaScript syntax
        run: node --check gpt_bridge.mjs
      - name: Unit tests (no external login)
        run: python -m unittest discover -s tests -v
      - name: PowerShell setup syntax (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'installa_gpt.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Out-String | Write-Host
            exit 1
          }
